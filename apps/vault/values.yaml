apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-values
  namespace: vault
data:
  values.yaml: |
    global:
      enabled: true

    injector:
      enabled: true

    server:
      image:
        repository: hashicorp/vault
        tag: latest

      serviceAccount:
        create: false
        name: vault-init

      extraEnvironmentVars:
        VAULT_SKIP_VERIFY: "true"

      readinessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
        port: 8200

      livenessProbe:
        enabled: true
        path: "/v1/sys/health?standbyok=true"
        port: 8200
        initialDelaySeconds: 60

      dataStorage:
        enabled: true
        size: 1Gi
        storageClass: local-path

      volumes:
        - name: vault-secrets
          hostPath:
            path: /opt/vault/secrets
            type: DirectoryOrCreate
        - name: vault-certs
          emptyDir: {}

      volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
        - name: vault-certs
          mountPath: /vault/certs

      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/certs/tls.crt"
            tls_key_file    = "/vault/certs/tls.key"
          }

          storage "file" {
            path = "/vault/data"
          }

      extraInitContainers:
        - name: init-certs
          image: alpine/openssl:latest
          command:
            - /bin/sh
            - -c
            - |
              openssl req -x509 -nodes -days 3650 \
                -newkey rsa:2048 \
                -keyout /vault/certs/tls.key \
                -out /vault/certs/tls.crt \
                -subj "/CN=vault.vault.svc.cluster.local" \
                -addext "subjectAltName=DNS:vault.vault.svc.cluster.local,DNS:vault,IP:127.0.0.1"
          volumeMounts:
            - name: vault-certs
              mountPath: /vault/certs

      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/service.serversscheme: https
          traefik.ingress.kubernetes.io/service.passHostHeader: "true"
          traefik.ingress.kubernetes.io/service.serversTransport: vault-vault-skip-verify@kubernetescrd
        hosts:
          - host: vault.local
            paths:
              - /
        tls:
          - hosts:
              - vault.local

    ui:
      enabled: true
      serviceType: ClusterIP