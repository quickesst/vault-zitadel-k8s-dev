apiVersion: batch/v1
kind: Job
metadata:
  name: vault-setup
  namespace: vault
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault-init
      volumes:
        - name: shared
          emptyDir: {}
      initContainers:
        - name: wait-for-vault-token
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              until kubectl get secret vault-root-token -n vault > /dev/null 2>&1; do
                echo "Waiting for vault-root-token secret..."
                sleep 5
              done
              echo "Secret found, proceeding."
        - name: vault-setup
          image: hashicorp/vault:latest
          env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_SKIP_VERIFY
              value: "true"
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: token
            - name: NEON_HOST
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: host
            - name: NEON_PORT
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: port
            - name: NEON_DATABASE
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: database
            - name: NEON_USER
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: username
            - name: NEON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neon-credentials
                  key: password
          volumeMounts:
            - name: shared
              mountPath: /shared
          command:
            - /bin/sh
            - -c
            - |
              until vault status 2>/dev/null | grep -q "Sealed.*false"; do
                echo "Waiting for Vault to be unsealed..."
                sleep 3
              done

              vault secrets enable -path=secret kv-v2 || true

              vault kv put secret/zitadel/db \
                host="$NEON_HOST" \
                port="$NEON_PORT" \
                database="$NEON_DATABASE" \
                username="$NEON_USER" \
                password="$NEON_PASSWORD"

              if ! vault kv get secret/zitadel/masterkey > /dev/null 2>&1; then
                MASTERKEY=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 32)
                vault kv put secret/zitadel/masterkey key="$MASTERKEY"
                echo "Masterkey generated and stored."
              else
                MASTERKEY=$(vault kv get -field=key secret/zitadel/masterkey)
                echo "Masterkey already exists, skipping."
              fi

              echo -n "$MASTERKEY" > /shared/masterkey

              vault auth enable kubernetes || true

              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc"

              vault policy write zitadel - <<POLICY
              path "secret/data/zitadel/*" {
                capabilities = ["read"]
              }
              POLICY

              vault write auth/kubernetes/role/zitadel \
                bound_service_account_names=zitadel \
                bound_service_account_namespaces=zitadel \
                policies=zitadel \
                ttl=1h

              echo "Vault setup complete."
      containers:
        - name: create-k8s-secrets
          image: bitnami/kubectl:latest
          volumeMounts:
            - name: shared
              mountPath: /shared
          command:
            - /bin/sh
            - -c
            - |
              kubectl create secret generic zitadel-masterkey \
                --from-literal=masterkey="$(cat /shared/masterkey)" \
                --namespace=zitadel \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "K8s secrets created."