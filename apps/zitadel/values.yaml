apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-values
  namespace: zitadel
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    zitadel:
      masterkeySecretName: zitadel-masterkey
      configSecretName: zitadel-db-config
      configmapConfig:
        ExternalSecure: false
        ExternalDomain: zitadel.local
        ExternalPort: 80
        TLS:
          Enabled: false

    replicaCount: 1

    service:
      type: ClusterIP
      port: 8080

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: zitadel.local
          paths:
            - path: /
              pathType: Prefix